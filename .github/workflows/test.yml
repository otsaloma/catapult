name: Test
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -c "import sys; print(sys.version)"
      - run: >
          sudo apt-get update && sudo apt-get install -y
          flake8
          fonts-noto-core
          fonts-noto-color-emoji
          gettext
          gir1.2-gtk-4.0
          gir1.2-pango-1.0
          make
          python3
          python3-cairo
          python3-gi
          python3-gi-cairo
          python3-pytest
          qalc
          xvfb

      - run: xvfb-run make check
      - run: xvfb-run pytest catapult
      - run: xvfb-run tools/test-install
